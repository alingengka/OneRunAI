<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">OneRunAI orbit logo</title>
  <defs>
    <linearGradient id="ring" x1="12" y1="52" x2="52" y2="10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity=".96"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#F3EEFC"/>
  <circle cx="31" cy="33" r="19" fill="none" stroke="#C4B5FD" stroke-opacity=".45" stroke-width="7"/>
  <path d="M47.4 23.4A19 19 0 1 0 49.7 38" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="49" cy="17" r="8" fill="url(#glow)" filter="url(#blur)"/>
