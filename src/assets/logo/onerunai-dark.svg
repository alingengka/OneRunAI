<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">OneRunAI orbit logo</title>
  <defs>
    <linearGradient id="ring" x1="11" y1="53" x2="51" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset=".48" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F5EDFF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#FFFFFF" stop-opacity=".98"/>
      <stop offset=".22" stop-color="#F5EDFF" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#E9D5FF" stop-opacity=".48"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere" cx="35%" cy="28%" r="72%">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9D5FF"/>
    </radialGradient>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5.6"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0A0A0F"/>
  <circle cx="31" cy="33" r="19" fill="none" stroke="#4C1D95" stroke-opacity=".32" stroke-width="7"/>
  <path d="M47.4 23.4A19 19 0 1 0 49.7 38" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="49" cy="17" r="11" fill="url(#halo)" filter="url(#blur)"/>
  <circle cx="49" cy="17" r="4" fill="url(#sphere)"/>
</svg>